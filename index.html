<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgorithmLab — сортировка и алгоритмы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="menu">
  <h1>AlgorithmLab</h1>
  <p>Интерактивный тренажёр алгоритмов сортировки</p>
</header>
<div class="app-layout">
  <main class="main-content">
    <section class="algorithm-panel">
      <h2>Выберите алгоритм</h2>
      <div class="button-group">
        <button class="button1 active" id="btn-bubble">Пузырьковая</button>
        <button class="button2" id="btn-selection">Выбором</button>
      </div>
    </section>
    <section class="workspace">
      <div class="custom-input-group">
        <input type="text" id="custom-array" placeholder="Введите числа: 10, 50, 20...">
        <button id="apply-array">Применить</button>
      </div>
      <section class="visualization-card">
        <div class="visualization-heading">
          <h2>Визуализация сортировки</h2>
          <span>Сравнение и перестановка элементов</span>
        </div>
        <canvas id="sortCanvas" width="600" height="300"></canvas>
      </section>
      <p id="step-text">Нажмите «Старт», чтобы начать</p>
      <div id="trainer-box">
        <h3 id="question-text">Вопрос</h3>
        <div class="trainer-actions">
          <button id="btn-swap">Поменять местами</button>
          <button id="btn-keep">Оставить как есть</button>
        </div>
        <div id="trainer-theory"><p id="theory-text"></p></div>
      </div>
      <section class="controls-card">
        <div class="button-group2">
          <button id="soda1" class="primary-button">Старт</button>
          <button id="pau" class="secondary-button">Пауза</button>
          <button id="res" class="secondary-button">Сброс</button>
        </div>
        <div class="settings-row">
          <label class="trainer-toggle" for="trainer-toggle">
            <input type="checkbox" id="trainer-toggle">
            <span>Режим тренажёра</span>
          </label>
          <div class="speed-control">
            <label for="speedSlider">Скорость</label>
            <input type="range" id="speedSlider" min="50" max="1000" value="500">
          </div>
        </div>
        <p id="status">Статус: Ожидание</p>
      </section>
    </section>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
